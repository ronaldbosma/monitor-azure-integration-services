openapi: 3.0.1
info:
  title: Movies API
  description: API for managing movies.
  version: 1.0.0
paths:
  /:
    get:
      operationId: get-movies
      summary: Get movies
      description: Gets a list of movies, optionally filtered by title.
      parameters:
        - name: title
          in: query
          description: Filter movies by exact title.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of movies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/movieSummary'
    post:
      operationId: create-movie
      summary: Create movie
      description: Creates a new movie. The id is generated by the API. The combination of title and year must be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/movieCreateRequest'
      responses:
        '201':
          description: The movie was created.
          headers:
            ETag:
              $ref: '#/components/headers/etag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/movie'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 400
                message: Title, description and year are required.
        '409':
          description: A movie with the same title already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 409
                message: A movie with the same title already exists.
  /{id}:
    get:
      operationId: get-movie-by-id
      summary: Get movie
      description: Gets the movie with the specified id, including all its details.
      parameters:
        - $ref: '#/components/parameters/movieId'
      responses:
        '200':
          description: The requested movie.
          headers:
            ETag:
              $ref: '#/components/headers/etag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/movie'
        '404':
          description: No movie was found with the specified id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 404
                message: No movie was found with the specified id.
    patch:
      operationId: update-movie
      summary: Update movie
      description: Updates the title, description, year and/or rating of the movie with the specified id. If title and year are changed, the combination must remain unique.
      parameters:
        - $ref: '#/components/parameters/movieId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/movieUpdateRequest'
      responses:
        '200':
          description: The movie was updated.
          headers:
            ETag:
              $ref: '#/components/headers/etag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/movie'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 400
                message: Year must be a valid integer.
        '404':
          description: No movie was found with the specified id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 404
                message: No movie was found with the specified id.
        '409':
          description: Another movie with the same title already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 409
                message: Another movie with the same title already exists.
        '412':
          description: The movie was modified by another request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 412
                message: The ETag does not match the current movie.
    delete:
      operationId: delete-movie
      summary: Delete movie
      description: Deletes the movie with the specified id.
      parameters:
        - $ref: '#/components/parameters/movieId'
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204':
          description: The movie was deleted.
        '404':
          description: No movie was found with the specified id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 404
                message: No movie was found with the specified id.
        '412':
          description: The movie was modified by another request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                statusCode: 412
                message: The ETag does not match the current movie.
components:
  headers:
    etag:
      description: The ETag of the movie.
      schema:
        type: string
  parameters:
    movieId:
      name: id
      in: path
      description: The id of the movie.
      required: true
      schema:
        type: string
        format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    ifMatch:
      name: If-Match
      in: header
      description: The ETag of the movie, used for optimistic concurrency. The operation is only performed if the ETag matches the value maintained by the server, indicating the movie hasn't been modified since it was retrieved by the client. Omitting the header will force an unconditional operation.
      required: false
      schema:
        type: string
        example: W/"datetime'2026-09-04T16%3A07%3A09.8702521Z'"
  schemas:
    movieTitle:
      type: string
      pattern: '\S'
      example: 'Star Wars: Episode IV - A New Hope'
    movieDescription:
      type: string
      pattern: '\S'
      example: Set in a galaxy far, far away, farm boy Luke Skywalker joins a wise Jedi, a roguish smuggler and two droids to rescue Princess Leia and deliver the stolen plans that could destroy the Empire's planet-killing Death Star.
    movieYear:
      type: integer
      minimum: 1000
      maximum: 9999
      example: 1977
    movieRating:
      type: number
      format: double
      minimum: 0
      maximum: 10
      example: 8.5
    movieSummary:
      type: object
      description: Summary information about a movie.
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title:
          $ref: '#/components/schemas/movieTitle'
        year:
          $ref: '#/components/schemas/movieYear'
      required:
        - id
        - title
        - year
    movie:
      type: object
      description: Full details of a movie.
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title:
          $ref: '#/components/schemas/movieTitle'
        description:
          $ref: '#/components/schemas/movieDescription'
        year:
          $ref: '#/components/schemas/movieYear'
        rating:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/movieRating'
      required:
        - id
        - title
        - description
        - year
    movieCreateRequest:
      type: object
      description: The properties required to create a movie.
      properties:
        title:
          $ref: '#/components/schemas/movieTitle'
        description:
          $ref: '#/components/schemas/movieDescription'
        year:
          $ref: '#/components/schemas/movieYear'
      required:
        - title
        - description
        - year
    movieUpdateRequest:
      type: object
      description: The properties that can be updated on a movie. All properties are optional, only the provided properties are updated.
      properties:
        title:
          $ref: '#/components/schemas/movieTitle'
        description:
          $ref: '#/components/schemas/movieDescription'
        year:
          $ref: '#/components/schemas/movieYear'
        rating:
          $ref: '#/components/schemas/movieRating'
    error:
      type: object
      description: An error response.
      properties:
        statusCode:
          type: integer
        message:
          type: string
      required:
        - statusCode
        - message
