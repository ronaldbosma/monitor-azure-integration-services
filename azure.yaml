# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: monitor-azure-integration-services
metadata:
  template: monitor-azure-integration-services@0.1.0
infra:
  layers:
    - name: base
      path: ./infra/01-base
    - name: application
      path: ./infra/02-application
services:
  functionApp:
    project: ./src/functionApp/FunctionApp
    host: function
    language: csharp
  logicApp:
    project: ./src/logicApp
    dist: Workflows
    host: function
    language: js # Logic Apps aren't natively supported by azd yet. By using js, the logic app will be zipped and deployed.
requiredVersions:
  azd: ">= 1.28.1" # azd version 1.28.1 or higher is required because we're using features from Bicep v0.45.6.
