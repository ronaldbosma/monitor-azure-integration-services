# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: monitor-azure-integration-services
metadata:
  template: monitor-azure-integration-services@0.1.0
infra:
  layers:
    - name: base
      path: ./infra/01-base
    - name: application
      path: ./infra/02-application
    - name: monitoring
      path: ./infra/03-monitoring
services:
  functionApp:
    project: ./src/functionApp/FunctionApp
    host: function
    language: csharp
  logicApp:
    project: ./src/logicApp
    dist: Workflows
    host: function
    language: logicappsstandard
requiredVersions:
  azd: ">= 1.39.1" # azd version 1.39.1 or higher is required because we're using features from Bicep v0.49.2.
  extensions:
    azure.logicappsstandard: "latest"
